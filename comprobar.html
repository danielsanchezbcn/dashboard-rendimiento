<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comprobación del dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { background: #0b0b0c; color: #ececec; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 1.6rem 0 .4rem; }
  p.sub { color: #9a9a9e; margin: 0 0 1rem; }
  table { border-collapse: collapse; width: 100%; max-width: 70rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #2a2a2e; vertical-align: top; }
  th { color: #9a9a9e; font-weight: 600; }
  .ok { color: #7ddc8a; } .mal { color: #ff6b6b; } .avi { color: #ecc94b; }
  code { background: #17171a; padding: .1rem .3rem; border-radius: .2rem; word-break: break-all; }
  #resumen { margin: 1rem 0; padding: .8rem 1rem; border: 1px solid #2a2a2e; border-radius: .4rem; background: #121214; }
  button { font: inherit; padding: .5rem 1rem; border-radius: .4rem; border: 1px solid #3a3a40; background: #1d1d21; color: #ececec; cursor: pointer; }
</style>
</head>
<body>
<h1>Comprobación del dashboard</h1>
<p class="sub">Esta página no toca ningún dato: solo mira si están todos los archivos y si la base de datos abre. Déjala en la misma carpeta que <code>index.html</code>.</p>
<div id="resumen">Comprobando…</div>
<button id="otra">Volver a comprobar</button>
<h2>Archivos del dashboard</h2>
<table id="tfiles"><thead><tr><th>Archivo</th><th>Estado</th><th>Detalle</th></tr></thead><tbody></tbody></table>
<h2>Base de datos de este navegador</h2>
<table id="tdb"><thead><tr><th>Comprobación</th><th>Estado</th><th>Detalle</th></tr></thead><tbody></tbody></table>

<script type="module">
// Módulos que el dashboard carga. Si falta uno, la pantalla se queda en «Cargando…» sin decir nada: esto es lo que lo detecta.
const MODULOS = [
  'main.js', 'app.js', 'db.js', 'libs.js', 'context.js', 'componentes.js', 'rutas.js', 'fechas.js', 'nombres.js', 'colores.js',
  'catalogo.js', 'catalogo-inicial.js', 'jugadores.js', 'posiciones.js', 'antropometria.js', 'evolucion.js', 'percentiles.js',
  'relativos.js', 'relaciones.js', 'radar.js', 'comparativa.js', 'natera.js', 'premier.js', 'isohold.js', 'composite.js',
  'alta-manual.js', 'isorack.js', 'targets.js', 'usos.js', 'backup.js', 'copiar.js', 'vald.js', 'asim-ui.js', 'fuentes.js',
  'pages.js', 'pages-evolucion.js', 'pages-composite.js', 'pages-deficits.js', 'pages-asimetrias.js', 'pages-normativo.js',
  'pages-percentiles.js', 'pages-relaciones.js', 'pages-asociaciones.js', 'pages-test.js', 'pages-jugadores.js',
  'pages-catalogo.js', 'pages-ajustes.js', 'pages-isorack.js', 'style.css', 'index.html',
];
const fila = (tabla, a, estado, clase, detalle) => {
  const tr = document.createElement('tr');
  const td = (t, c) => { const x = document.createElement('td'); x.textContent = t; if (c) x.className = c; return x; };
  tr.append(td(a), td(estado, clase), td(detalle ?? ''));
  document.querySelector(tabla + ' tbody').append(tr);
};

async function comprobarArchivos() {
  const malos = [];
  for (const m of MODULOS) {
    try {
      const r = await fetch(m + '?c=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) { malos.push(m); fila('#tfiles', m, 'NO ESTÁ', 'mal', 'El servidor responde ' + r.status); continue; }
      const txt = await r.text();
      if (/^\s*$/.test(txt)) { malos.push(m); fila('#tfiles', m, 'VACÍO', 'mal', '0 bytes'); continue; }
      fila('#tfiles', m, 'está', 'ok', Math.round(txt.length / 1024) + ' KB');
    } catch (e) { malos.push(m); fila('#tfiles', m, 'NO SE PUEDE LEER', 'mal', String(e.message || e)); }
  }
  return malos;
}

// Carga de verdad el módulo principal: así salen los errores de sintaxis o los imports rotos que no se ven mirando archivo por archivo.
async function comprobarCarga() {
  try {
    const db = await import('./db.js?c=' + Date.now());
    fila('#tdb', 'Versión del dashboard en db.js', db.APP_VERSION ?? '(no se encuentra)', db.APP_VERSION ? 'ok' : 'avi', '');
  } catch (e) { fila('#tdb', 'Cargar db.js', 'FALLA', 'mal', String(e.message || e)); return false; }
  for (const m of ['app.js', 'pages-evolucion.js', 'pages-composite.js', 'pages-isorack.js', 'main.js']) {
    try { await import('./' + m + '?c=' + Date.now()); fila('#tdb', 'Cargar ' + m, 'ok', 'ok', ''); }
    catch (e) { fila('#tdb', 'Cargar ' + m, 'FALLA', 'mal', String(e.message || e)); return false; }
  }
  return true;
}

async function comprobarBase() {
  if (!('indexedDB' in window)) { fila('#tdb', 'IndexedDB', 'NO DISPONIBLE', 'mal', 'El navegador no permite guardar datos aquí (¿ventana privada?)'); return; }
  const info = await new Promise((ok) => {
    let bloqueada = false;
    const rq = indexedDB.open('dashboard-rendimiento');
    rq.onblocked = () => { bloqueada = true; };
    rq.onsuccess = () => { const d = rq.result; const r = { version: d.version, tablas: [...d.objectStoreNames] }; d.close(); ok(r); };
    rq.onerror = () => ok({ error: rq.error?.message ?? 'no se pudo abrir' });
    setTimeout(() => ok({ error: bloqueada ? 'bloqueada por otra pestaña del dashboard' : 'no responde (sigue abriendo)' }), 6000);
  });
  if (info.error) { fila('#tdb', 'Abrir la base', 'FALLA', 'mal', info.error); return; }
  fila('#tdb', 'Abrir la base', 'ok', 'ok', 'Versión interna ' + info.version + ' (esquema ' + (info.version / 10) + ')');
  fila('#tdb', 'Tablas', String(info.tablas.length), info.tablas.length >= 21 ? 'ok' : 'avi', info.tablas.join(', '));
  fila('#tdb', 'Tabla isoRack (esquema 7)', info.tablas.includes('isoRack') ? 'está' : 'todavía no', info.tablas.includes('isoRack') ? 'ok' : 'avi', info.tablas.includes('isoRack') ? '' : 'Se crea al abrir el dashboard con la versión nueva');
  const n = await new Promise((ok) => { const rq = indexedDB.open('dashboard-rendimiento'); rq.onsuccess = () => { const d = rq.result; if (!d.objectStoreNames.contains('players')) { d.close(); return ok(null); } const c = d.transaction('players').objectStore('players').count(); c.onsuccess = () => { d.close(); ok(c.result); }; c.onerror = () => { d.close(); ok(null); }; }; rq.onerror = () => ok(null); });
  fila('#tdb', 'Jugadores guardados', n === null ? '?' : String(n), n ? 'ok' : 'avi', n ? 'Tus datos están ahí' : '');
}

async function todo() {
  document.querySelectorAll('tbody').forEach((t) => t.replaceChildren());
  document.getElementById('resumen').textContent = 'Comprobando…';
  const malos = await comprobarArchivos();
  const carga = await comprobarCarga();
  await comprobarBase();
  const r = document.getElementById('resumen');
  if (malos.length) r.innerHTML = '<strong class="mal">Faltan ' + malos.length + ' archivo(s):</strong> <code>' + malos.join('</code>, <code>') + '</code>. Vuelve a descomprimir el zip en esta carpeta, sustituyendo los archivos.';
  else if (!carga) r.innerHTML = '<strong class="mal">Están todos los archivos, pero uno falla al cargarse.</strong> Mira el detalle en rojo de la tabla de abajo: ahí está la causa.';
  else r.innerHTML = '<strong class="ok">Todos los archivos están y cargan bien.</strong> Si el dashboard sigue en «Cargando…», hazme una foto de esta pantalla entera.';
}
document.getElementById('otra').addEventListener('click', todo);
todo();
</script>
</body>
</html>
